name: Route Strategy Ablation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1"

jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Candidate-size ablation
        run: PYTHONPATH=backend python scripts/evaluate_route_strategy.py --candidate-limits 40,80,120,160,220 --adaptive --experiment v2 --output-dir artifacts/candidate-size
      - name: Module ablation
        run: PYTHONPATH=backend python scripts/evaluate_route_strategy.py --candidate-limits '' --adaptive --all-ablations --output-dir artifacts/modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-strategy-ablation
          path: artifacts
