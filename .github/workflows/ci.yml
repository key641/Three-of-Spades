name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m pytest backend/app/tests -q
      - run: python -m compileall -q backend/app scripts
      - name: Route strategy release gates
        run: PYTHONPATH=backend python scripts/evaluate_route_strategy.py --candidate-limits '' --adaptive --assert-gates --output-dir artifacts/route-strategy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-strategy-report
          path: artifacts/route-strategy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
